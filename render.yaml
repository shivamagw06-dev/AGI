# Render blueprint - 13F collection only.
#
# This file deliberately defines ONE service. The API and the intelligence
# engine were created in the Render dashboard and are managed there; listing
# them here would mean two sources of truth for services that are already
# running, and a blueprint sync could then reconcile production against
# whatever this file happened to say.
#
# Why a Render cron job rather than a GitHub Actions schedule: the collector
# writes to the database with the service-role key. Running it in Actions would
# mean copying a database-admin credential into a second system that does not
# otherwise hold one. Here it runs inside the environment that already has the
# credential, and the key never leaves it.
#
# To connect: Render Dashboard -> New -> Blueprint -> select this repository.
# Attach the same environment group the API service uses, so the cron job reads
# one copy of the credentials rather than its own duplicate.

services:
  - type: cron
    name: institutional-13f-collection
    runtime: node
    plan: starter
    region: oregon

    # 06:20 UTC daily. 13F is a quarterly disclosure with a 45-day deadline, so
    # filings arrive in waves around 15 Feb, May, Aug and Nov and nothing moves
    # between them. A daily pass catches a wave within a day, which is well
    # inside the delay already inherent in the data. It sits before the Indian
    # market opens and clear of the 12:45 UTC live-data sweep, so a long crawl
    # contends with neither.
    schedule: "20 6 * * *"

    buildCommand: npm ci --no-audit --no-fund
    # 50 minutes, not 20. The first real run made 1,339 SEC requests against
    # 51 managers and was cut off at the ceiling with roughly half the roster
    # left. Pacing alone accounts for two of those minutes; parsing and writing
    # thousands of holdings rows accounts for the rest.
    startCommand: >-
      node server/scripts/collectInstitutionalFilings.mjs
      --trigger schedule
      --schedule "20 6 * * *"
      --max-minutes 50

    envVars:
      # Attach the API service's environment group in the dashboard so these
      # resolve from one place. Listed with sync:false so the blueprint never
      # carries secret values in git.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SEC_USER_AGENT
        sync: false
      # Half of EDGAR's published ten-per-second ceiling. The limit is applied
      # per source address, and this job shares one with the rest of the
      # account's egress.
      - key: SEC_MAX_REQUESTS_PER_SECOND
        value: "5"
      # This process is the deliberate collector. The flag stays off so that
      # importing the service never starts a second crawl inside it.
      - key: INSTITUTIONAL_AUTO_REFRESH
        value: "false"
      - key: COLLECTION_SCHEDULE
        value: "20 6 * * *"

  # Daily price refresh for the securities the tracked managers hold.
  #
  # Separate from the collection job because the two answer to different
  # clocks. A 13F arrives four times a year; a closing price arrives every
  # session, and everything built on prices - the revaluation on a fund page,
  # the screener's coverage gate, any backtest - is only as current as the last
  # fetch. Left unscheduled the whole price layer decays from the day it was
  # built, silently, because a stale price still renders as a number.
  #
  # It tops up recent sessions rather than rebuilding history. The fetch log
  # records what was asked for and when, so a run costs one request per symbol
  # for a handful of bars instead of seven years of them.
  - type: cron
    name: institutional-price-refresh
    runtime: node
    plan: starter
    region: oregon

    # 23:30 UTC, which is 19:30 ET - after the US close and its settlement, and
    # clear of both the 06:20 collection run and the 12:45 live-data sweep.
    schedule: "30 23 * * *"

    buildCommand: npm ci --no-audit --no-fund
    # A ten-day window covers a long weekend plus a missed run or two, so a
    # night the job does not run leaves no hole. --max-age-days 0 because a
    # daily job under the backfill's four-day rule would find nothing due,
    # every day, and report success.
    startCommand: >-
      node server/scripts/backfillPrices.mjs
      --apply
      --refresh
      --window-days 10

    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false

  # Nightly retention for live_market_snapshots.
  #
  # Without this, the one-off prune is undone in eleven days. The table takes
  # about 171 MB a day of new rows, and the pruning left 1,960 MB of reusable
  # space inside the file - so the room bought back is consumed in under a
  # fortnight and the file starts growing again. Run daily the arithmetic
  # closes: 171 MB in, 119 MB freed by blanking rows at three days, 52 MB
  # freed by deleting them at twenty-five. The table goes flat and stays there.
  #
  # That is the point of the job. A one-off prune is a reprieve; the schedule
  # is the fix. A full disk puts Postgres into read-only, which takes the site
  # down.
  #
  # Same reasoning as the other two jobs for why this is a Render cron and not
  # a GitHub Actions schedule: it writes with the service-role key, and that
  # credential should not be copied into a second system.
  - type: cron
    name: live-snapshot-retention
    runtime: node
    plan: starter
    region: oregon

    # 20:30 UTC - 02:00 IST. Clear of the Indian session the feed follows, of
    # the 06:20 collection run, of the 12:45 live-data sweep, and of the 23:30
    # price refresh. Nothing else is touching the database at that hour.
    schedule: "30 20 * * *"

    buildCommand: npm ci --no-audit --no-fund
    # 25 minutes covers a normal night many times over - a day's worth is a
    # couple of batches and takes seconds. The headroom is for catching up
    # after a night the job did not run, where the backlog is proportionally
    # larger. The script stops cleanly at the ceiling and the next run resumes,
    # because the blanking skips rows already emptied and the delete skips rows
    # already gone.
    startCommand: >-
      node server/scripts/pruneLiveSnapshots.mjs
      --apply
      --max-minutes 25

    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
