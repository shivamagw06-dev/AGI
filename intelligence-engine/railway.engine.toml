# Railway config for agib-intelligence-engine (HTTP web service).
# Dashboard: Root Directory = intelligence-engine, Config File Path = railway.engine.toml
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "bash scripts/railway_start.sh"
# Railway probes /v1/health — only valid when uvicorn is running (engine path).
healthcheckPath = "/v1/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
