# Railway config for agib-intelligence-worker (background gather worker).
# Dashboard: Root Directory = intelligence-engine, Config File Path = railway.worker.toml
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "bash scripts/railway_start.sh"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
