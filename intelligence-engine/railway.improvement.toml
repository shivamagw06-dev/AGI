# Railway config for agi-improvement-worker (background evaluation only).
# Dashboard: service name = agi-improvement-worker
# Root Directory = intelligence-engine
# Config File Path = railway.improvement.toml
# Public networking = OFF
# Replicas = 1
#
# Calls agib-intelligence-engine directly at POST /v1/ui/search.
# Does NOT require agib-api. Does NOT start the AGI web server.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "python scripts/improvement_worker.py"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
numReplicas = 1
