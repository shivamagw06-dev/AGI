name: AGI Plus billing guards
on:
  pull_request:
    paths: ['src/**', 'server/**', 'supabase/migrations/**', 'package*.json', '.github/workflows/agi-plus.yml']
  workflow_dispatch:
jobs:
  billing-guards:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.1'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm ci --prefix server --ignore-scripts --no-audit --no-fund
      - run: node --test src/lib/agiPlus.test.js src/lib/accessPolicy.test.js server/routes/agiPlus.test.js
