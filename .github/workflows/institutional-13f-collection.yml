name: Institutional 13F Collection

# The scheduled home for SEC collection, which until now ran inside the API
# server fifteen seconds after every deploy.
#
# Daily rather than continuous, because 13F is a quarterly disclosure with a
# 45-day deadline: managers file in waves around 15 February, 15 May, 15 August
# and 15 November, and nothing changes between those waves. A daily pass picks
# up a wave within a day of it landing, which is far inside the delay already
# baked into the data.
#
# 06:20 UTC is before the Indian market opens and well clear of the 12:45
# live-data sweep, so a long crawl cannot contend with either.

on:
  schedule:
    - cron: '20 6 * * *'
  workflow_dispatch:
    inputs:
      manager:
        description: 'Manager slug, or "all"'
        default: 'all'
      quarters:
        description: 'Quarters of history to request'
        default: '12'

# Never two crawls at once. The whole reason the in-process version was
# dangerous is that concurrent runs multiply the request rate against a limit
# that is enforced per source address.
concurrency:
  group: institutional-13f-collection
  cancel-in-progress: false

jobs:
  collect:
    name: Collect 13F filings from EDGAR
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci --no-audit --no-fund

      # Say plainly what is missing. A collector that starts, crawls, and then
      # cannot write is worse than one that never started: it spends the rate
      # budget and reports a data failure for what is a configuration problem.
      - name: Check the collector can write
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          missing=""
          [ -z "${SUPABASE_URL:-}" ] && missing="SUPABASE_URL"
          [ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ] && missing="$missing SUPABASE_SERVICE_ROLE_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing. 13F collection cannot run until these are set."
            exit 1
          fi
          echo "Credentials present."

      - name: Collect
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          # Half the published ceiling. We share an egress address with every
          # other job on this runner pool, and the limit is per source.
          SEC_MAX_REQUESTS_PER_SECOND: '5'
        run: |
          node server/scripts/collectInstitutionalFilings.mjs \
            --manager "${{ inputs.manager || 'all' }}" \
            --quarters "${{ inputs.quarters || '12' }}" \
            --max-minutes 20
