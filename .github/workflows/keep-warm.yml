name: Keep AGIB services warm

# Pings both Render services on a schedule so neither one idles into a cold
# start. Primary fix is the Render plan (see render.yaml — must be Starter+,
# not Free); this workflow is a second layer of defense plus an early
# warning if a service is actually down (job fails -> visible in Actions).
#
# The failure path above was the stated intent but was never implemented: both
# probes only emitted ::warning:: and exited 0. On 2026-08-19 the engine was
# down from ~03:32Z onward while every run reported "success", so nothing
# alerted for hours. A warning nobody receives is not an early warning.

on:
  schedule:
    # Every 10 minutes, day and night.
    - cron: '*/10 * * * *'
  workflow_dispatch:

concurrency:
  group: keep-warm
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Probe Render services
        shell: bash
        run: |
          set -uo pipefail

          # Three attempts with backoff: a single transient should not page,
          # but a real outage still surfaces inside one 10-minute cycle.
          probe() {
            local name="$1" url="$2" out="$3" code=""
            for attempt in 1 2 3; do
              # curl's exit status is captured separately. The previous
              # `|| echo 000` ran after -w had already printed the code and
              # concatenated onto it, which is why the logs read "000000".
              code="$(curl -sS -o "$out" -w '%{http_code}' --max-time 25 "$url")" || code="000"
              [ -z "$code" ] && code="000"
              if [ "$code" = "200" ]; then
                echo "$name -> $code (attempt $attempt)"
                return 0
              fi
              echo "$name -> $code (attempt $attempt of 3)"
              if [ "$attempt" -lt 3 ]; then sleep 10; fi
            done
            echo "$name FAILED after 3 attempts (last code $code)"
            return 1
          }

          failed=""

          if probe "agib-api /api/health" \
              "https://finance-news-backend-19i5.onrender.com/api/health" /tmp/api.json; then
            head -c 400 /tmp/api.json 2>/dev/null || true; echo
          else
            failed="${failed} agib-api"
          fi

          if probe "agib-intelligence-engine /v1/health" \
              "https://agib-intelligence-engine.onrender.com/v1/health" /tmp/engine.json; then
            head -c 400 /tmp/engine.json 2>/dev/null || true; echo
          else
            failed="${failed} agib-intelligence-engine"
          fi

          # Lightweight public warm. Deliberately never fails the job: the
          # health probes are what keep Render awake, and a full-universe
          # terminal or dashboard call here would compete with real users.
          warm="$(curl -sS -o /tmp/warm.json -w '%{http_code}' --max-time 10 \
            'https://finance-news-backend-19i5.onrender.com/api/market/briefing')" || warm="000"
          echo "briefing -> ${warm:-000}"

          if [ -n "${failed# }" ]; then
            {
              echo "### Render service health"
              echo
              echo "Unhealthy after 3 attempts: **${failed# }**"
              echo
              echo "What to check in the Render dashboard:"
              echo "- Logs for an OOM kill or an unhandled exception on boot"
              echo "- Memory and CPU against the Pro plan limits"
              echo "- Disk usage on the 50 GB \`intelligence-data\` volume — a full"
              echo "  disk wedges writes and the process stops answering"
              echo "- Whether the most recent deploy actually succeeded"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Render services unhealthy after retries:${failed}"
            exit 1
          fi

          echo "All probed services healthy." >> "$GITHUB_STEP_SUMMARY"
